<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanzz - Bio Link</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- SCREEN LOADING --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #loader h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        #loader p {
            color: #86868b;
            font-size: 0.95rem;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.3; }
        }

        /* --- MAIN CONTAINER --- */
        .container {
            width: 100%;
            max-width: 450px; /* Standar ukuran layar HP */
            margin-top: 20px;
            display: none; /* Disembunyikan dulu saat loading */
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Top Header Navigation */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .brand-title {
            font-size: 0.8rem;
            font-weight: 500;
            color: #86868b;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .menu-btn {
            background: #1c1c1e;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Profile Section */
        .profile-section {
            margin-bottom: 25px;
        }

        .avatar-wrapper {
            width: 90px;
            height: 90px;
            border-radius: 28px;
            overflow: hidden;
            margin-bottom: 18px;
            background: linear-gradient(45deg, #f39c12, #d35400); /* Fallback gradasi jika gambar error */
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .profile-name {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .verified-badge {
            color: #2f80ed;
            font-size: 1.1rem;
        }

        .profile-bio {
            color: #86868b;
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* --- BLOK INFORMASI (Lokasi, Hobi, Status) --- */
        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .info-card {
            background-color: #1c1c1e;
            border-radius: 20px;
            padding: 16px 20px;
        }

        .info-label {
            color: #636366;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.05rem;
            font-weight: 600;
        }

        /* --- SEKSI LINK UTAMA --- */
        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #636366;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
            margin-left: 4px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .link-card {
            background-color: #1c1c1e;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: white;
            transition: background-color 0.2s ease;
        }

        .link-card:active {
            background-color: #2c2c2e;
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background-color: #2c2c2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }

        /* Kustomisasi warna ikon tiruan */
        .icon-donate { color: #00ff87; }
        .icon-wa { color: #25d366; }

        .link-text {
            display: flex;
            flex-direction: column;
        }

        .link-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .link-desc {
            font-size: 0.8rem;
            color: #636366;
            margin-top: 2px;
        }

        .external-icon {
            color: #636366;
            font-size: 0.9rem;
            padding-right: 4px;
        }

        /* --- SEKSI SOSIAL MEDIA --- */
        .socials-grid {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background-color: #1c1c1e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .social-btn:active {
            background-color: #2c2c2e;
        }

        /* --- FOOTER --- */
        footer {
            color: #48484a;
            font-size: 0.8rem;
            margin-left: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="loader">
        <h1>Yanzz</h1>
        <p>Sabar Bang🚀</p>
    </div>

    <div class="container" id="main-content">
        
        <div class="top-nav">
            <div class="brand-title">YANZZ KING SAKRAL</div>
            <button class="menu-btn">
                <i class="fa-solid fa-grip"></i>
            </button>
        </div>

        <div class="profile-section">
            <div class="avatar-wrapper">
                <img src="https://files.catbox.moe/eg91iv.jpg" alt="Yanzz Avatar">
            </div>
            <div class="profile-name-wrapper">
                <h2 class="profile-name">YANZZ</h2>
                <i class="fa-solid fa-circle-check verified-badge"></i>
            </div>
            <p class="profile-bio">eyy santai tipiss tipiss</p>
        </div>

        <div class="info-grid">
            <div class="info-card">
                <div class="info-label">Lokasi</div>
                <div class="info-value">Indonesia</div>
            </div>
            <div class="info-card">
                <div class="info-label">Hobi</div>
                <div class="info-value">Ngegame</div>
            </div>
            <div class="info-card">
                <div class="info-label">Status</div>
                <div class="info-value">Online</div>
            </div>
        </div>

        <div class="section-title">Main Links</div>

        <div class="links-wrapper">
            <a href="https://sociabuzz.com/yanzz_donet/tribe" target="_blank" class="link-card">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-solid fa-wallet icon-donate"></i>
                    </div>
                    <div class="link-text">
                        <span class="link-title">Donate Support</span>
                        <span class="link-desc">Support my content</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
            </a>

            <a href="https://whatsapp.com/channel/0029Vb8oKxyId7nHoIJlIu2T" target="_blank" class="link-card">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-brands fa-whatsapp icon-wa"></i>
                    </div>
                    <div class="link-text">
                        <span class="link-title">WhatsApp Channel Yanzz</span>
                        <span class="link-desc">Join the official community</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
            </a>
        </div>

        <div class="section-title">Socials</div>

        <div class="socials-grid">
            <a href="https://t.me/yanzzofficiall" target="_blank" class="social-btn">
                <i class="fa-brands fa-telegram"></i>
            </a>
            <a href="https://tiktok.com/@yanzzsukasakral" target="_blank" class="social-btn">
                <i class="fa-brands fa-tiktok"></i>
            </a>
        </div>

        <footer>
            &copy; Powered By Yanzz
        </footer>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Memberikan efek simulasi loading selama 1.5 detik agar mirip aplikasi aslinya
            setTimeout(() => {
                const loader = document.getElementById('loader');
                const content = document.getElementById('main-content');
                
                loader.style.opacity = '0';
                loader.style.transform = 'scale(0.95)';
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    content.style.display = 'block';
                }, 500);
            }, 1500); 
        });
    </script>
</body>
</html>
